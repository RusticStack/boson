<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boson terminals</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<header>
  <span class="brand">Boson terminals</span>
  <button id="split-h" title="Split right (Ctrl+Shift+D)">Split right</button>
  <button id="split-v" title="Split down (Ctrl+Shift+E)">Split down</button>
  <button id="new-ps" title="PowerShell pane">PowerShell</button>
  <button id="close" title="Close the focused pane (Ctrl+Shift+W)">Close pane</button>
  <button id="toggle" title="Hide / show the focused pane (output keeps buffering natively)">Hide pane</button>
  <span id="status"></span>
</header>
<main id="root"></main>
<script src="/app.js"></script>
</body>
</html>
